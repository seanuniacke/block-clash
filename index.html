<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f17">
  <title>Clash of Lorna</title>
  
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%230f172a' stroke='%2306b6d4' stroke-width='2'/><path d='M16 48 C16 34 22 26 32 26 C42 26 48 34 48 48 Z' fill='%23334155'/><circle cx='32' cy='24' r='11' fill='%23fed7aa'/><path d='M20 18 C22 8 42 8 44 18 C46 26 45 32 45 38 C41 33 39 30 32 30 C25 30 23 33 19 38 C19 32 18 26 20 18 Z' fill='%23d97706'/><path d='M22 21 L32 15 L42 21 L37 23 L32 19 L27 23 Z' fill='%23f59e0b'/><path d='M12 50 L24 38 M52 50 L40 38' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round'/></svg>">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body.theme-dark {
      background-color: #0b0f17;
      color: #e6edf3;
    }
    body.theme-dark header { background: #131924; border-bottom: 1px solid #242d3d; }
    body.theme-dark .panel-box { background: #131924; border: 1px solid #242d3d; }
    body.theme-dark .inner-box { background: #111827; border: 1px solid #2a364d; }
    /* Lighter board frame and cell shades in dark mode */
    body.theme-dark #board { background: #1b2538; border: 1px solid #364766; }
    body.theme-dark .cell { background: #26344d; border: 1px solid #354666; }
    body.theme-dark .cell:hover { background: #314261; }
    body.theme-dark .cell.obstacle { background: #475569; border: 1px solid #64748b; color: #f1f5f9; }
    body.theme-dark button { background: #1d2535; color: #f1f5f9; border: 1px solid #2f3b52; }
    body.theme-dark button:hover { background: #28344a; }
    body.theme-dark .input-field { background: #070a0f; border: 1px solid #242d3d; color: #f0f6fc; }

    body.theme-light {
      background-color: #e2e8f0;
      color: #1e293b;
    }
    body.theme-light header { background: #ffffff; border-bottom: 1px solid #cbd5e1; }
    body.theme-light .panel-box { background: #ffffff; border: 1px solid #cbd5e1; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05); }
    body.theme-light .inner-box { background: #e2e8f0; border: 1px solid #cbd5e1; }
    /* Brighter board frame and cell shades in light mode */
    body.theme-light #board { background: #f1f5f9; border: 1.5px solid #cbd5e1; }
    body.theme-light .cell { background: #ffffff; border: 1.5px solid #dbe4f0; }
    body.theme-light .cell:hover { background: #f8fafc; }
    body.theme-light .cell.obstacle { background: #94a3b8; border: 1.5px solid #64748b; color: #0f172a; }
    body.theme-light button { background: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1; }
    body.theme-light button:hover { background: #e2e8f0; }
    body.theme-light .input-field { background: #ffffff; border: 1.5px solid #cbd5e1; color: #0f172a; }
    body.theme-light .turn-status, body.theme-light .tray-bar, body.theme-light .setting-label { color: #64748b; }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    header {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 40;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .warrior-logo-svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 5px rgba(6, 182, 212, 0.45));
    }

    .brand-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.8px;
      line-height: 1.1;
      white-space: nowrap;
      background: linear-gradient(135deg, #22d3ee 0%, #fb7185 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    button {
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 2px 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .scoreboard {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
      margin-top: 2px;
      z-index: 20;
    }

    .score-card {
      border-radius: 12px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s, opacity 0.2s;
    }

    .score-card.active-p1 {
      border: 2px solid #0891b2 !important;
      opacity: 1;
    }
    body.theme-dark .score-card.active-p1 { border-color: #06b6d4 !important; }

    .score-card.active-p2 {
      border: 2px solid #e11d48 !important;
      opacity: 1;
    }
    body.theme-dark .score-card.active-p2 { border-color: #ec4899 !important; }

    .score-card.waiting {
      opacity: 0.45;
    }

    .player-tag {
      font-size: 11px;
      font-weight: 800;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .turn-status {
      font-size: 8.5px;
      font-weight: 700;
    }

    .score-val {
      font-size: 18px;
      font-weight: 900;
    }

    #banner {
      display: none;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      padding: 5px 8px;
      border-radius: 6px;
      flex-shrink: 0;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 3px;
      z-index: 20;
    }

    .banner-waiting {
      display: flex !important;
      background: rgba(234, 179, 8, 0.15) !important;
      border: 1px solid rgba(234, 179, 8, 0.4) !important;
      color: #b45309 !important;
    }
    body.theme-dark .banner-waiting { color: #facc15 !important; }

    .banner-connected {
      display: flex !important;
      background: rgba(16, 185, 129, 0.15) !important;
      border: 1px solid rgba(16, 185, 129, 0.4) !important;
      color: #059669 !important;
    }
    body.theme-dark .banner-connected { color: #34d399 !important; }

    .arena-container {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 4px 0;
    }

    #board {
      width: min(92vw, calc(100dvh - 215px), 520px);
      height: min(92vw, calc(100dvh - 215px), 520px);
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 3px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      flex-shrink: 0;
      z-index: 5;
    }

    .cell {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(14px, 2.8vmin, 24px);
      line-height: 1;
      overflow: hidden;
      transition: background-color 0.1s ease;
    }

    .cell.p1 {
      background: rgba(6, 182, 212, 0.38) !important;
      border-color: #06b6d4 !important;
    }

    .cell.p2 {
      background: rgba(244, 63, 94, 0.38) !important;
      border-color: #f43f5e !important;
    }

    .cell.preview-valid {
      background: rgba(34, 211, 238, 0.6) !important;
      outline: 2px solid #22d3ee;
      outline-offset: -2px;
      transform: scale(0.96);
    }

    .cell.preview-invalid {
      background: rgba(244, 63, 94, 0.5) !important;
      outline: 2px solid #f43f5e;
      outline-offset: -2px;
    }

    .tray-wrap {
      width: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 2px;
      z-index: 10;
    }

    .tray-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      font-weight: 700;
      padding: 0 4px;
    }

    #tray {
      width: 100%;
      height: 72px;
      border-radius: 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 6px;
      padding: 5px;
    }

    .slot {
      flex: 1;
      height: 100%;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      transition: border-color 0.15s, transform 0.15s;
    }

    .slot.selected {
      border: 2px solid #22d3ee !important;
      transform: scale(1.03);
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
    }

    .slot.used {
      opacity: 0.22;
      cursor: default;
    }

    .slot.dragging-source {
      opacity: 0.2;
    }

    #drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: none;
      opacity: 0.95;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.65));
    }

    #celebration-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      width: 100%;
      height: 100%;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow-y: auto;
    }

    .modal.open {
      display: flex !important;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      max-height: 94dvh;
      border-radius: 16px;
      padding: clamp(14px, 3.5vw, 20px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
      padding-bottom: 8px;
      position: sticky;
      top: -16px;
      z-index: 10;
      margin-top: -4px;
    }
    body.theme-dark .modal-header { background: #131924; }
    body.theme-light .modal-header { background: #ffffff; }

    .modal-footer {
      position: sticky;
      bottom: -16px;
      padding-top: 8px;
      margin-bottom: -4px;
      z-index: 10;
    }
    body.theme-dark .modal-footer { background: #131924; border-top: 1px solid rgba(148, 163, 184, 0.25); }
    body.theme-light .modal-footer { background: #ffffff; border-top: 1px solid rgba(148, 163, 184, 0.25); }

    .section-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #22d3ee;
      display: flex;
      align-items: center;
      gap: 5px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      padding-bottom: 4px;
      margin-top: 4px;
    }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .setting-label {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      outline: none;
    }

    .btn-group-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-group-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .btn-group-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }

    .avatar-opt-btn {
      font-size: 18px;
      padding: 4px 0;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
    }

    .opt-btn.active-opt, .avatar-opt-btn.active-opt {
      background: #083344 !important;
      border-color: #06b6d4 !important;
      color: #22d3ee !important;
    }

    .active-room-display {
      border: 1px dashed #06b6d4;
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #94a3b8;
    }

    .history-card {
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .setup-summary-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: rgba(6, 182, 212, 0.08);
      border: 1px solid rgba(6, 182, 212, 0.25);
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
    }

    .setup-pill {
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(6, 182, 212, 0.16);
      color: #22d3ee;
    }

    #tv-view {
      display: none;
      flex: 1;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
    }

    #tv-view.open {
      display: flex;
    }

    #tv-board-grid {
      width: min(84vmin, 600px);
      height: min(84vmin, 600px);
      background: #1b2538;
      border: 4px solid #4f46e5;
      border-radius: 20px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 5px;
    }
  </style>
