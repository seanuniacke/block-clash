<div id="welcome-modal" class="modal">
    <div class="modal-box panel-box" style="border: 2px solid #06b6d4; text-align: center; max-width: 370px; gap: 10px;">
      <!-- Top & Center Game Title -->
      <div style="font-size: 19px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(135deg, #22d3ee 0%, #fb7185 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        CLASH OF LORNA
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
        <span id="welcome-avatar-display" style="font-size: 26px; line-height: 1;">🧝‍♀️</span>
        <div style="text-align: left;">
          <h2 id="welcome-main-title" style="font-size: 14px; font-weight: 800; color: #e2e8f0;">Welcome!</h2>
          <div id="returning-user-notice" style="display:none; font-size: 10.5px; color: #22d3ee;">
            Playing as <b id="welcome-returning-name">Player</b>
          </div>
        </div>
      </div>

      <!-- New User Profile Fields -->
      <div id="new-user-fields" style="display:none; flex-direction:column; gap:6px; text-align:left; background: rgba(148,163,184,0.06); padding: 8px; border-radius: 8px; border: 1px solid rgba(148,163,184,0.18);">
        <div class="setting-row">
          <span class="setting-label" style="font-size: 9.5px;">Your Warrior Name</span>
          <input type="text" id="welcome-name-input" class="input-field" placeholder="Enter name" maxlength="14" value="Player" style="padding: 5px 8px; font-size: 11.5px;" />
        </div>
        <div class="setting-row">
          <span class="setting-label" style="font-size: 9.5px;">Choose Avatar</span>
          <div class="avatar-grid" id="welcome-avatar-grid">
            <button class="avatar-opt-btn active-opt" data-avatar="🧝‍♀️" style="font-size: 15px; padding: 3px 0;">🧝‍♀️</button>
            <button class="avatar-opt-btn" data-avatar="⚔️" style="font-size: 15px; padding: 3px 0;">⚔️</button>
            <button class="avatar-opt-btn" data-avatar="🧙‍♀️" style="font-size: 15px; padding: 3px 0;">🧙‍♀️</button>
            <button class="avatar-opt-btn" data-avatar="🛡️" style="font-size: 15px; padding: 3px 0;">🛡️</button>
            <button class="avatar-opt-btn" data-avatar="🐉" style="font-size: 15px; padding: 3px 0;">🐉</button>
            <button class="avatar-opt-btn" data-avatar="🦅" style="font-size: 15px; padding: 3px 0;">🦅</button>
            <button class="avatar-opt-btn" data-avatar="🦁" style="font-size: 15px; padding: 3px 0;">🦁</button>
            <button class="avatar-opt-btn" data-avatar="🐺" style="font-size: 15px; padding: 3px 0;">🐺</button>
            <button class="avatar-opt-btn" data-avatar="🐯" style="font-size: 15px; padding: 3px 0;">🐯</button>
            <button class="avatar-opt-btn" data-avatar="🦊" style="font-size: 15px; padding: 3px 0;">🦊</button>
            <button class="avatar-opt-btn" data-avatar="👑" style="font-size: 15px; padding: 3px 0;">👑</button>
            <button class="avatar-opt-btn" data-avatar="💎" style="font-size: 15px; padding: 3px 0;">💎</button>
          </div>
        </div>
      </div>

      <!-- SECTION 1: LOCAL PLAY -->
      <div style="background: rgba(148, 163, 184, 0.06); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; text-align: left;">
        <span style="font-size: 10px; font-weight: 900; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.6px;">🏠 Local Play (This Device)</span>
        <div class="btn-group-3">
          <button id="welcome-play-bot-btn" style="background: #0284c7; border-color: #0ea5e9; color: #fff; padding: 6px 4px; font-size: 10.5px; font-weight: 700;">
            🤖 vs Bot
          </button>
          <button id="welcome-pass2-btn" style="background: #1e293b; border-color: #334155; color: #e2e8f0; padding: 6px 4px; font-size: 10.5px; font-weight: 700;">
            👥 2P Local
          </button>
          <button id="welcome-pass4-btn" style="background: #1e293b; border-color: #334155; color: #e2e8f0; padding: 6px 4px; font-size: 10.5px; font-weight: 700;">
            🤝 2v2 Local
          </button>
        </div>
      </div>

      <!-- SECTION 2: ONLINE MULTIPLAYER -->
      <div style="background: rgba(6, 182, 212, 0.05); border: 1px solid rgba(6, 182, 212, 0.25); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; text-align: left;">
        <span style="font-size: 10px; font-weight: 900; color: #22d3ee; text-transform: uppercase; letter-spacing: 0.6px;">🌐 Online Multiplayer</span>

        <!-- Sub-section: Create Online Game -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 10px; font-weight: 700; color: #94a3b8;">Create Online Game</span>
          <div class="btn-group-3">
            <button id="welcome-create-pvp-btn" style="background: #065f46; border-color: #059669; color: #fff; padding: 6px 4px; font-size: 10.5px; font-weight: 700;">
              ⚔️ 2P Duel
            </button>
            <button id="welcome-create-4p-btn" style="background: #b45309; border-color: #d97706; color: #fff; padding: 6px 4px; font-size: 10.5px; font-weight: 700;">
              🏟️ 4P FFA
            </button>
            <button id="welcome-create-2v2-btn" style="background: #6d28d9; border-color: #7c3aed; color: #fff; padding: 6px 4px; font-size: 10.5px; font-weight: 700;">
              🤝 2v2 Teams
            </button>
          </div>
        </div>

        <!-- Sub-section: Join Online Game -->
        <div style="border-top: 1px solid rgba(148, 163, 184, 0.18); padding-top: 6px; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 10px; font-weight: 700; color: #94a3b8;">Join Online Game</span>
          <div style="display: flex; gap: 5px; align-items: center;">
            <input type="text" id="welcome-join-code-input" class="input-field" placeholder="ROOM CODE" maxlength="10" style="flex:1; text-transform:uppercase; font-size:11px; padding: 5px 8px; height: 28px; letter-spacing:0.5px;" />
            <button id="welcome-join-btn" style="background: #4f46e5; border-color: #6366f1; color: #fff; padding: 0 10px; height: 28px; font-size:10.5px; font-weight: 700; white-space:nowrap;">Join</button>
          </div>
        </div>
      </div>
    </div>
  </div>
