<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Block Clash Duel v4.0</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Fredoka', cursive, sans-serif;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      touch-action: none;
      overscroll-behavior: none;
      transition: background-color 0.2s ease, color 0.2s ease;
      height: 100dvh;
      overflow: hidden;
    }

    /* Dark Theme (Default) */
    body.theme-dark {
      background-color: #090d16;
      color: #f1f5f9;
    }
    body.theme-dark .panel-bg { background-color: rgba(15, 23, 42, 0.9); border-color: #1e293b; }
    body.theme-dark .board-bg { background-color: #030712; border-color: #1e293b; }
    body.theme-dark .empty-cell { background-color: #0f172a; border: 1px solid #1e293b; }
    body.theme-dark .empty-cell:hover { background-color: #1e293b; }

    /* Light Theme */
    body.theme-light {
      background-color: #f1f5f9;
      color: #0f172a;
    }
    body.theme-light .panel-bg { background-color: #ffffff; border-color: #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06); }
    body.theme-light .board-bg { background-color: #e2e8f0; border-color: #cbd5e1; }
    body.theme-light .empty-cell { background-color: #ffffff; border: 1px solid #cbd5e1; }
    body.theme-light .empty-cell:hover { background-color: #f8fafc; }

    /* Dynamic Drop Preview */
    .cell-preview-valid {
      background-color: rgba(56, 189, 248, 0.6) !important;
      outline: 2px solid #38bdf8 !important;
      outline-offset: -2px;
      transform: scale(0.96);
    }
    .cell-preview-invalid {
      background-color: rgba(244, 63, 94, 0.45) !important;
      outline: 2px solid #f43f5e !important;
      outline-offset: -2px;
    }

    /* Fixed equal 8x8 grid cells */
    .board-grid-equal {
      display: grid !important;
      grid-template-columns: repeat(8, minmax(0, 1fr)) !important;
      grid-template-rows: repeat(8, minmax(0, 1fr)) !important;
    }

    /* Responsive board container */
    .responsive-board-box {
      width: min(92vw, 48dvh, 520px) !important;
      height: min(92vw, 48dvh, 520px) !important;
      aspect-ratio: 1 / 1 !important;
      flex-shrink: 0 !important;
    }

    .board-cell-square {
      aspect-ratio: 1 / 1 !important;
      width: 100% !important;
      height: 100% !important;
    }

    .mulligan-btn {
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .mulligan-btn:disabled {
      opacity: 0.35 !important;
      cursor: not-allowed !important;
      filter: grayscale(1);
    }

    .selected-tray-slot {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.55);
      transform: scale(1.04);
    }

    /* Floating Drag Ghost */
    #floating-drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: none;
      opacity: 0.95;
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.65));
      touch-action: none;
      will-change: left, top;
    }
  </style>
</head>
<body class="theme-dark w-full h-[100dvh] flex flex-col justify-between overflow-hidden">

  <!-- Floating Drag Element -->
  <div id="floating-drag-ghost"></div>

  <!-- TOP APP BAR -->
  <header class="w-full px-3 py-1.5 flex items-center justify-between border-b panel-bg shrink-0 z-30">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-cyan-500 to-pink-500 flex items-center justify-center text-xs font-bold text-white shadow-md">
        ⚔️
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide leading-none text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">
          BLOCK CLASH
        </h1>
        <div class="flex items-center gap-1 mt-0.5">
          <span id="header-mode-badge" class="text-[9px] px-1.5 py-0.2 rounded bg-cyan-950/70 text-cyan-300 border border-cyan-800 font-semibold">Pass &amp; Play</span>
          <span id="header-lvl-badge" class="text-[9px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-400 font-medium">Lvl 1</span>
        </div>
      </div>
    </div>

    <!-- Right Header Controls -->
    <div class="flex items-center gap-2">
      <button id="quick-pvp-btn" class="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center gap-1 shadow transition active:scale-95" title="Play Online vs Friend">
        <span>👥</span>
        <span>PvP</span>
      </button>
      <button id="tv-toggle-btn" class="px-2.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center gap-1 shadow transition active:scale-95">
        <span>📺</span>
        <span>TV</span>
      </button>
      <button id="settings-btn" class="p-1.5 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm transition" title="Settings &amp; Modes">
        ⚙️
      </button>
    </div>
  </header>

  <!-- =========================================================================
       STANDARD MAIN VIEW (Mobile & Desktop Browser)
       ========================================================================= -->
  <main id="standard-view" class="w-full max-w-4xl mx-auto flex-1 px-3 py-1 flex flex-col justify-between items-center overflow-hidden min-h-0">
    
    <!-- Scoreboard -->
    <section class="w-full max-w
