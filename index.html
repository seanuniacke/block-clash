<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Block Clash Duel</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    /* Reset & Base */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
    
    /* Theme Variables */
    body.theme-dark {
      --bg: #090d16;
      --panel: #0f172a;
      --panel-border: #1e293b;
      --board-bg: #030712;
      --cell-empty: #0f172a;
      --cell-border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    body.theme-light {
      --bg: #f8fafc;
      --panel: #ffffff;
      --panel-border: #cbd5e1;
      --board-bg: #e2e8f0;
      --cell-empty: #ffffff;
      --cell-border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
    }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; justify-content: space-between; }

    /* Layout Containers */
    header {
      width: 100%; height: 48px; padding: 0 12px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--panel); border-bottom: 1px solid var(--panel-border);
      flex-shrink: 0; z-index: 10;
    }
    .main-arena {
      flex: 1; width: 100%; max-width: 600px; margin: 0 auto;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 6px 12px; overflow: hidden;
    }

    /* Scoreboard */
    .scoreboard { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex-shrink: 0; }
    .score-card {
      background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 12px; padding: 6px 10px;
      display: flex; align-items: center; justify-content: space-between;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .score-card.active-p1 { border-color: #06b6d4; }
    .score-card.active-p2 { border-color: #ec4899; }
    .score-card.inactive { opacity: 0.5; }
    .player-title { font-size: 12px; font-weight: 700; }
    .player-status { font-size: 9px; font-weight: 600; text-transform: uppercase; }
    .score-num { font-size: 18px; font-weight: 800; margin-left: 6px; }

    /* Turn Banner */
    #turn-banner { font-size: 12px; font-weight: 600; text-align: center; color: var(--text-muted); padding: 4px 0; flex-shrink: 0; }

    /* Board Sizing: Strict 1:1 Aspect Ratio Squares */
    .board-wrapper {
      flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
      min-height: 0; overflow: hidden;
    }
    #board {
      width: min(92vw, calc(100dvh - 210px), 540px);
      height: min(92vw, calc(100dvh - 210px), 540px);
      max-width: 540px; max-height: 540px;
      aspect-ratio: 1 / 1;
      background: var(--board-bg);
      border: 2px solid var(--panel-border);
      border-radius: 16px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 4px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .board-cell {
      width: 100%; height: 100%; aspect-ratio: 1 / 1;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.1s;
    }
    .cell-empty { background: var(--cell-empty); border: 1px solid var(--cell-border); }
    .cell-p1 { background: rgba(6, 182, 212, 0.35); border: 1px solid #06b6d4; color: #22d3ee; }
    .cell-p2 { background: rgba(236, 72, 153, 0.35); border: 1px solid #ec4899; color: #f472b6; }
    .cell-stone { background: #334155; border: 1px solid #475569; color: #94a3b8; }
    .cell-hover-valid { background: rgba(34, 211, 238, 0.6) !important; outline: 2px solid #22d3ee; }
    .cell-hover-invalid { background: rgba(244, 63, 94, 0.5) !important; outline: 2px solid #f43f5e; }

    /* Piece Tray */
    .tray-container { width: 100%; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding-bottom: 6px; }
    .tray-toolbar { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); padding: 0 4px; }
    #tray {
      width: 100%; height: 74px; background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 16px; display: flex; align-items: center; justify-content: space-around;
      gap: 8px; padding: 6px; touch-action: none;
    }
    .tray-slot {
      flex: 1; height: 100%; background: var(--bg); border: 1px solid var(--panel-border);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      cursor: grab; transition: transform 0.15s, border-color 0.15s;
    }
    .tray-slot.selected { border-color: #22d3ee; transform: scale(1.04); box-shadow: 0 0 12px rgba(34, 211, 238, 0.4); }
    .tray-slot.used { opacity: 0.3; cursor: default; }

    /* Generic Buttons */
    button {
      border: 1px solid var(--panel-border); background: var(--panel); color: var(--text);
      font-size: 11px; font-weight: 700; border-radius: 8px; padding: 4px 8px; cursor: pointer;
    }
    button:active { transform: scale(0.96); }
    .btn-primary { background: #4f46e5; border-color: #6366f1; color: white; }
    .btn-restart { background: rgba(225, 29, 72, 0.2); border-color: #be123c; color: #fb7185; }

    /* Modals & Overlays */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-card {
      background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 20px; width: 100%; max-width: 380px; max-height: 90vh;
      display: flex; flex-direction: column; gap: 12px; padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5); overflow-y: auto;
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; }
    .hidden { display: none !important; }

    /* Floating Drag Element */
    #drag-ghost {
      position: fixed; pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%); display: none; opacity: 0.95;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
    }

    /* TV Arena Screen */
    #tv-arena {
      flex: 1; width: 100%; max-width: 1000px; margin: 0 auto;
      display: flex; flex-direction: row; align-items: center; justify-content: space-around;
      padding: 16px; gap: 20px; overflow-y: auto;
    }
    #tv-board {
      width: min(75vmin, 520px); height: min(75vmin, 520px);
      aspect-ratio: 1 / 1; background: #030712; border: 4px solid #4f46e5;
      border-radius: 20px; display: grid; grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr); gap: 4px; padding: 8px;
    }
  </style>
</head>
<body class="theme-dark">

  <div id="drag-ghost"></div>

  <!-- Header -->
  <header>
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:16px;">⚔️</span>
      <div>
        <div style="font-size:13px; font-weight:800; background:linear-gradient(to right, #22d3ee, #ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">BLOCK CLASH</div>
        <div style="font-size:9px; color:var(--text-muted);"><span id="badge-mode">Pass &amp; Play</span> • <span id="badge-lvl">Lvl 1</span></div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <button id="tv-toggle-btn" class="btn-primary" style="display:flex; align-items:center; gap:4px;"><span>📺</span><span>TV Mode</span></button>
      <button id="settings-btn" style="font-size:13px; padding:4px 8px;">⚙️</button>
    </div>
  </header>

  <!-- TV Big Arena (Hidden by Default) -->
  <main id="tv-arena" class="hidden">
    <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
      <div id="tv-board"></div>
      <div id="tv-banner" style="font-size:16px; font-weight:700; color:#22d3ee; padding:6px 16px; background:var(--panel); border-radius:30px; border:1px solid var(--panel-border);">Waiting for players to connect...</div>
    </div>
    <div style="background:var(--panel); border:2px solid #4f46e5; border-radius:24px; padding:20px; text-align:center; max-width:320px; display:flex; flex-direction:column; align-items:center; gap:12px;">
      <h2 style="font-size:18px; font-weight:800; color:#cbd5e1;">TV PARTY ARENA</h2>
      <p style="font-size:11px; color:var(--text-muted);">Scan QR code with your phone camera to play on TV!</p>
      <div id="qrcode-box" style="padding:8px; background:white; border-radius:12px;">
        <img id="tv-qr-img" src="" alt="QR" style="width:160px; height:160px; display:block;" />
      </div>
      <div style="font-family:monospace; font-size:12px; color:#22d3ee;">Room: <b id="tv-room-label" style="font-size:14px; color:white;">----</b></div>
      <div style="width:100%; display:flex; justify-content:space-around; border-top:1px solid var(--panel-border); pt:10px;">
